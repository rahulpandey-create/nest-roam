
name: Backend Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/nest_roam_deploy
          chmod 600 ~/.ssh/nest_roam_deploy
          ssh-keyscan -p "${{ secrets.CPANEL_PORT }}" "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload backend files
        run: |
          rsync -az \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            -e "ssh -i ~/.ssh/nest_roam_deploy -p ${{ secrets.CPANEL_PORT }}" \
            server/ \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:/home/${{ secrets.CPANEL_USER }}/api.nestroamholidays.com/

      - name: Install production dependencies and restart
        run: |
          ssh -i ~/.ssh/nest_roam_deploy \
            -p "${{ secrets.CPANEL_PORT }}" \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            'source /home/nestroamholidays/nodevenv/api.nestroamholidays.com/20/bin/activate && cd /home/nestroamholidays/api.nestroamholidays.com && npm ci --omit=dev && mkdir -p tmp && touch tmp/restart.txt'